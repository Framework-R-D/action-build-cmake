name: "Build with CMake"
description: "Builds the project using CMake"

inputs:
  source-path:
    description: "Path where source code is checked out"
    required: false
    default: "phlex-src"
  build-path:
    description: "Path for build directory"
    required: false
    default: "phlex-build"
  target:
    description: "CMake target to build (empty for default target)"
    required: false
    default: ""
  parallel-jobs:
    description: "Number of parallel jobs (empty for auto-detect)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - shell: bash
      working-directory: ${{ inputs.build-path }}
      run: |
        # Source the container entrypoint script
        . /entrypoint.sh

        jobs="${PARALLEL_JOBS:-$(nproc)}"
        if [[ ! "$jobs" =~ ^[1-9][0-9]*$ ]]; then
          echo '::error::parallel-jobs must be a positive integer.'
          exit 1
        fi
        args=(--build . --parallel "$jobs")
        if [ -n "$TARGET" ]; then
          if [[ "$TARGET" == -* || "$TARGET" == *$'\n'* || "$TARGET" == *$'\r'* ]]; then
            echo '::error::Invalid CMake target.'
            exit 1
          fi
          args+=(--target "$TARGET")
        fi
        cmake "${args[@]}"
      env:
        TARGET: ${{ inputs.target }}
        PARALLEL_JOBS: ${{ inputs.parallel-jobs }}
        CICOLOR_FORCE: 1
